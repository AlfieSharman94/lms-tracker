<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Man Standing</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>Last Man Standing</h1>
    <p>All the LMS games I'm in. Click a game to see the plan, picks and fixtures.</p>
  </header>

  <section>
    <div class="section-head" style="margin-bottom:12px">
      <h2>Active games</h2>
    </div>
    <div class="games" id="active"></div>
    <p class="empty" id="active-empty" hidden>No active games right now.</p>
  </section>

  <section id="finished-section" hidden>
    <div class="section-head" style="margin-bottom:12px">
      <h2>Finished games</h2>
      <button type="button" class="toggle" id="toggle" aria-expanded="false"></button>
    </div>
    <div class="games" id="finished" hidden></div>
  </section>
</div>

<script>
const bust = '?v=' + Date.now();
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function stat(label, value) {
  const d = el('div');
  d.append(el('p', 'label', label), el('p', 'big', value));
  return d;
}

function card(g) {
  const s = g.summary || {};
  const a = el('a', 'card game' + (g.status === 'finished' ? ' finished' : ''));
  a.href = 'game.html?g=' + encodeURIComponent(g.slug);
  const top = el('div', 'row');
  top.append(el('h2', null, g.name), el('span', 'status ' + g.status, g.status === 'finished' ? 'Finished' : 'Active'));
  a.append(top, el('p', 'sub', (g.competition || '') + ' · started ' + (g.started || '')));
  const stats = el('div', 'stats');
  stats.append(
    stat('My entries alive', s.my_alive + ' of ' + s.my_total),
    stat('Entries left', String(s.entries_remaining ?? '—')),
    stat('Out last week', String(s.knocked_out ?? '—') + (s.knocked_out_pct ? ' (' + s.knocked_out_pct + ')' : '')),
  );
  a.append(stats);
  const next = el('div', 'next');
  if (g.status === 'finished') {
    next.textContent = g.result || 'Game finished';
  } else {
    next.append(el('span', 'muted', 'Next: ' + (g.next_week || '') + ' · '));
    next.append(el('strong', null, (s.next_pick || 'TBC') + (s.next_pick_pct ? ' ' + s.next_pick_pct + '%' : '')));
    if (g.deadline) next.append(el('div', 'sub', 'Deadline ' + g.deadline));
  }
  a.append(next, el('p', 'sub', 'Updated ' + (g.updated || '')));
  return a;
}

(async () => {
  const reg = await (await fetch('games.json' + bust)).json();
  const games = (await Promise.all(reg.games.map(async (slug) => {
    try { return await (await fetch('games/' + slug + '.json' + bust)).json(); } catch { return null; }
  }))).filter(Boolean);
  const active = games.filter((g) => g.status !== 'finished');
  const finished = games.filter((g) => g.status === 'finished');
  active.forEach((g) => document.getElementById('active').append(card(g)));
  document.getElementById('active-empty').hidden = active.length > 0;
  if (finished.length) {
    document.getElementById('finished-section').hidden = false;
    finished.forEach((g) => document.getElementById('finished').append(card(g)));
    const t = document.getElementById('toggle'), box = document.getElementById('finished');
    const label = () => { t.textContent = (box.hidden ? 'Show' : 'Hide') + ' finished (' + finished.length + ')'; t.setAttribute('aria-expanded', String(!box.hidden)); };
    t.addEventListener('click', () => { box.hidden = !box.hidden; label(); });
    label();
  }
})();
</script>
</body>
</html>
