name: Update odds

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, about 120 credits a month
  workflow_dispatch:          # "Run workflow" button for a manual refresh

permissions:
  contents: write
  pages: write

concurrency: odds

jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch odds
        run: python3 scripts/fetch_odds.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Commit odds.json
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add odds.json
          git diff --cached --quiet || (git commit -m "Update odds" && git push)
      - name: Rebuild Pages
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
